<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>page not found — Still Making</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap">
  <style>
    :root {
      --bg: #F4F3EE;
      --ink: #1A1A17;
      --faint: #8A897E;
      --signal: #E8501A;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161613;
        --ink: #F1EFE7;
        --faint: #7C7B71;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .code {
      font-size: clamp(64px, 14vw, 120px);
      font-weight: 600;
      letter-spacing: -0.02em;
      display: flex;
      align-items: baseline;
    }
    .cursor {
      display: inline-block;
      width: 0.5em; height: 0.14em;
      background: var(--signal);
      margin-left: 0.18em;
      animation: blink 1.2s step-end infinite;
    }
    p { margin: 0; font-size: 15px; color: var(--faint); line-height: 1.6; }
    a {
      margin-top: 10px;
      font-size: 14px; font-weight: 500;
      color: var(--signal);
      text-decoration: none;
      border-bottom: 1px solid var(--signal);
      padding-bottom: 2px;
    }
    a:hover { color: var(--ink); border-color: var(--ink); }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
</head>
<body>
  <div class="code"><span>404</span><span class="cursor"></span></div>
  <p>page not found — we're still making this one.</p>
  <a href="/">back to stillmaking.studio</a>
</body>
</html>
